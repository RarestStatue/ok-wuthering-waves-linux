# The Linux port's own gate, on the ok-ww side.
#
# The fork's CI (`RarestStatue/ok-script-linux`, `.github/workflows/linux.yml`) proves the
# library's suite and its three drift gates pass. That is a weaker claim than the one that
# matters here: that *this* app, with *this* config, still starts against the fork. Only
# `tools/check_linux_startup.py` asserts that, it lives here because it needs ok-ww's own
# config, and nothing ran it until now -- every other workflow in this repo is
# `windows-latest`.
#
# The gate hard-requires a DISPLAY and calls `os._exit`, both of which are fine under
# `xvfb-run`.

name: Linux startup gate

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-gate:
    name: ok-ww starts on Linux
    runs-on: ubuntu-latest
    steps:
      # No `submodules` and no `lfs`, deliberately. `ok_templates` is pinned to
      # 515962ce, which is on no ref of the upstream labeling repo any more, so
      # `submodules: true` fails the whole job in `actions/checkout` with
      # `upload-pack: not our ref` before anything is installed -- which is exactly how
      # the first version of this workflow "ran" the gate: it never did. The gate stops at
      # capture-method selection and never loads a template, and it passes locally with
      # `ok_templates/` empty. `.gitattributes` declares no `filter=lfs`, so `lfs: true`
      # fetched nothing either.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these even under `QT_QPA_PLATFORM=offscreen` (the gate sets it itself),
      # because `OK()` constructs the Qt app; xvfb because the X11 window layer needs a
      # real display to enumerate.
      - name: Runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            xvfb

      # requirements-linux.txt is the Linux lock: it pins ok-script to a fork *commit*,
      # so a green run here is a statement about an exact pair of trees.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt

      - name: Phase 2-3 exit gate
        run: xvfb-run -a python tools/check_linux_startup.py
